<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Interactive Stories App</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding-bottom: 90px;
        overflow-x: hidden;
      }

      .container {
        max-width: 480px;
        margin: 0 auto;
        padding: 20px 16px;
        position: relative;
      }

      /* Header */
      .app-header {
        text-align: center;
        margin-bottom: 30px;
        padding: 20px 0;
      }

      .app-title {
        color: white;
        font-size: 28px;
        font-weight: 700;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        margin-bottom: 8px;
      }

      .app-subtitle {
        color: rgba(255, 255, 255, 0.8);
        font-size: 14px;
        font-weight: 400;
      }

      /* Card styles with glassmorphism */
      .card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        margin-bottom: 20px;
        transition: all 0.3s ease;
        transform: translateY(0);
      }

      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      }

      .card-header {
        padding: 20px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.1),
          rgba(255, 255, 255, 0.05)
        );
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      }

      .user-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .user-details {
        display: flex;
        align-items: center;
      }

      .avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        margin-right: 12px;
        object-fit: cover;
        border: 3px solid rgba(255, 255, 255, 0.3);
        transition: transform 0.3s ease;
      }

      .avatar:hover {
        transform: scale(1.05);
      }

      .user-info {
        display: flex;
        flex-direction: column;
      }

      .user-name {
        font-weight: 600;
        font-size: 16px;
        color: #2d3748;
        margin-bottom: 2px;
      }

      .posted-time {
        font-size: 12px;
        color: #718096;
        opacity: 0.8;
      }

      .header-actions {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .audio-icon,
      .bookmark-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
      }

      .audio-icon {
        color: #667eea;
      }

      .bookmark-icon {
        color: #f093fb;
      }

      .audio-icon:hover,
      .bookmark-icon:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: scale(1.1);
      }

      .bookmark-icon.bookmarked {
        background: linear-gradient(135deg, #f093fb, #f5576c);
        color: white;
      }

      .card-content {
        padding: 20px;
        font-size: 15px;
        color: #2d3748;
        line-height: 1.6;
      }

      .show-more {
        color: #667eea;
        font-size: 14px;
        cursor: pointer;
        margin-top: 8px;
        display: inline-block;
        font-weight: 500;
        transition: color 0.3s ease;
      }

      .show-more:hover {
        color: #5a67d8;
        text-decoration: underline;
      }

      .card-footer {
        padding: 16px 20px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.1),
          rgba(255, 255, 255, 0.05)
        );
        border-top: 1px solid rgba(0, 0, 0, 0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .emoji-group {
        display: flex;
        gap: 8px;
        font-size: 18px;
      }

      .emoji-group span {
        cursor: pointer;
        transition: transform 0.2s ease;
        padding: 4px;
        border-radius: 8px;
      }

      .emoji-group span:hover {
        transform: scale(1.2);
        background: rgba(255, 255, 255, 0.2);
      }

      .footer-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .sentiment {
        font-size: 12px;
        font-weight: 500;
        padding: 4px 8px;
        border-radius: 12px;
        background: linear-gradient(135deg, #4facfe, #00f2fe);
        color: white;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      }

      .category {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        font-size: 11px;
        font-weight: 500;
        padding: 6px 12px;
        border-radius: 15px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* Bottom Navigation with glassmorphism */
      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 16px 0;
        z-index: 999;
        box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
      }

      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        transition: all 0.3s ease;
        padding: 8px 16px;
        border-radius: 12px;
        user-select: none;
      }

      .nav-item:hover {
        background: rgba(102, 126, 234, 0.1);
        transform: translateY(-2px);
      }

      .nav-item.active {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        transform: translateY(-2px);
      }

      .nav-item i {
        font-size: 20px;
        margin-bottom: 4px;
      }

      .nav-item span {
        font-size: 12px;
        font-weight: 500;
      }

      /* Floating Action Button */
      .fab {
        position: fixed;
        bottom: 100px;
        right: 20px;
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, #f093fb, #f5576c);
        border-radius: 50%;
        box-shadow: 0 8px 25px rgba(240, 147, 251, 0.4);
        color: white;
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 1000;
        transition: all 0.3s ease;
        animation: float 3s ease-in-out infinite;
      }

      .fab:hover {
        transform: scale(1.1);
        box-shadow: 0 12px 35px rgba(240, 147, 251, 0.6);
      }

      .fab:active {
        transform: scale(0.95);
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      /* Screen containers */
      .screen {
        display: none;
        animation: fadeIn 0.3s ease-in-out;
      }

      .screen.active {
        display: block;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* User Screen Styles */
      .user-screen-content {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 30px;
        margin-bottom: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      }

      .user-screen-content h3 {
        color: #2d3748;
        margin-bottom: 20px;
        font-size: 24px;
        font-weight: 600;
      }

      .user-screen-content h4 {
        color: #2d3748;
        margin: 30px 0 20px 0;
        font-size: 20px;
        font-weight: 600;
      }

      .story-input {
        width: 100%;
        min-height: 120px;
        font-size: 16px;
        padding: 16px;
        border-radius: 12px;
        border: 2px solid rgba(102, 126, 234, 0.2);
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        resize: vertical;
        font-family: inherit;
        transition: all 0.3s ease;
      }

      .story-input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .post-btn {
        margin-top: 16px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        border: none;
        padding: 14px 28px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      }

      .post-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      }

      .post-btn:active {
        transform: translateY(0);
      }

      /* Bookmark Screen */
      .bookmark-list {
        list-style: none;
        padding: 0;
      }

      .bookmark-item {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        margin-bottom: 16px;
        padding: 20px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: all 0.3s ease;
      }

      .bookmark-item:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      }

      .bookmark-item strong {
        color: #667eea;
        font-weight: 600;
      }

      /* Empty State */
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: rgba(255, 255, 255, 0.8);
      }

      .empty-state i {
        font-size: 48px;
        margin-bottom: 16px;
        opacity: 0.6;
      }

      .empty-state h3 {
        font-size: 20px;
        margin-bottom: 8px;
        font-weight: 600;
      }

      .empty-state p {
        font-size: 14px;
        opacity: 0.8;
      }

      /* Modal Styles */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(10px);
        z-index: 1100;
        justify-content: center;
        align-items: center;
        padding: 20px;
        animation: fadeIn 0.3s ease-in-out;
      }

      .modal {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        padding: 30px;
        border-radius: 20px;
        max-width: 90%;
        max-height: 80%;
        overflow-y: auto;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.2);
        transform: scale(0.9);
        animation: modalSlideIn 0.3s ease-out forwards;
      }

      @keyframes modalSlideIn {
        to {
          transform: scale(1);
        }
      }

      .modal-close {
        background: linear-gradient(135deg, #667eea, #764ba2);
        border: none;
        color: white;
        padding: 12px 24px;
        margin-top: 20px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .modal-close:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      }

      /* Responsive Design */
      @media (max-width: 480px) {
        .container {
          padding: 16px 12px;
        }

        .app-title {
          font-size: 24px;
        }

        .card-header,
        .card-content {
          padding: 16px;
        }

        .user-screen-content {
          padding: 20px;
        }
      }

      /* Loading Animation */
      @keyframes shimmer {
        0% {
          background-position: -200px 0;
        }
        100% {
          background-position: calc(200px + 100%) 0;
        }
      }

      .loading {
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200px 100%;
        animation: shimmer 1.5s infinite;
      }
    </style>
    <!-- Font Awesome for icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <!-- App Header -->
      <div class="app-header">
        <h1 class="app-title"><i class="fas fa-book-open"></i> True Stories</h1>
        <p class="app-subtitle">Share your moments, inspire others</p>
      </div>

      <!-- Story Screen -->
      <div id="story-screen" class="screen active"></div>

      <!-- Bookmark Screen -->
      <div id="bookmark-screen" class="screen"></div>

      <!-- User Screen -->
      <div id="user-screen" class="screen">
        <div class="user-screen-content">
          <h3>Create New Story</h3>
          <textarea
            id="new-story-text"
            class="story-input"
            placeholder="What's your story today? Share something that matters to you..."
          ></textarea>
          <button id="post-story-btn" class="post-btn">
            <i class="fas fa-paper-plane"></i> Share Story
          </button>
          <h4>Your Stories</h4>
          <div id="user-posts"></div>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <div class="nav-item active" id="tab-story">
        <i class="fas fa-home"></i>
        <span>Stories</span>
      </div>
      <div class="nav-item" id="tab-bookmark">
        <i class="fas fa-bookmark"></i>
        <span>Saved</span>
      </div>
      <div class="nav-item" id="tab-user">
        <i class="fas fa-user-circle"></i>
        <span>Profile</span>
      </div>
    </div>

    <!-- Floating Action Button -->
    <div class="fab" title="Create New Story">
      <i class="fas fa-plus" style="margin: 20px"></i>
    </div>

    <!-- Modal for Read More -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div id="modal-content"></div>
        <button class="modal-close">Close</button>
      </div>
    </div>

    <script>
      // Sample stories data with enhanced content
      const stories = [
        {
          id: 1,
          user: {
            name: 'Jeet Parmar',
            avatar: 'https://i.pravatar.cc/100?img=3',
          },
          postedTime: '2 hours ago',
          audio: true,
          content:
            "Today, I took the first step toward a new beginning. Leaving fear behind opened the door to personal growth and true potential. Sometimes the biggest risk is not taking any risk at all. I've learned that comfort zones are beautiful places, but nothing ever grows there. It's time to embrace the unknown and trust the journey ahead.",
          emojis: ['👍', '❤️', '😊', '🔥', '👏'],
          sentiment: 'Positive 😊',
          category: 'Motivation',
        },
        {
          id: 2,
          user: {
            name: 'Priya Sinha',
            avatar: 'https://i.pravatar.cc/100?img=5',
          },
          postedTime: '4 hours ago',
          audio: true,
          content:
            'A morning walk in nature reminded me how much peace we can find when we pause and truly breathe. The way sunlight filters through leaves, the sound of birds singing their morning songs, and the gentle breeze carrying the scent of flowers - these simple moments hold profound healing power. In our fast-paced world, we often forget to stop and appreciate the natural beauty that surrounds us every day.',
          emojis: ['🌿', '💚', '☀️', '🙏', '🌸'],
          sentiment: 'Peaceful 😌',
          category: 'Wellness',
        },
        {
          id: 3,
          user: {
            name: 'Ravi Mehra',
            avatar: 'https://i.pravatar.cc/100?img=8',
          },
          postedTime: '6 hours ago',
          audio: true,
          content:
            "Success doesn't happen overnight. After years of trying, I finally closed my first big project. Hard work pays off — keep going. Every rejection was a redirection, every failure was a lesson, and every small win was a step closer to this moment. The journey taught me resilience, patience, and the importance of believing in yourself even when others don't.",
          emojis: ['💪', '👏', '🚀', '💼', '🎉'],
          sentiment: 'Inspired 🔥',
          category: 'Achievement',
        },
        {
          id: 4,
          user: {
            name: 'Maya Chen',
            avatar: 'https://i.pravatar.cc/100?img=1',
          },
          postedTime: '8 hours ago',
          audio: false,
          content:
            "Learning a new language has opened doors I never imagined. Today I had my first conversation entirely in Spanish with a local vendor at the market. The smile on his face when he realized I could understand him was priceless. Language is more than words - it's a bridge to understanding different cultures and connecting with people on a deeper level.",
          emojis: ['🗣️', '🌍', '📚', '❤️', '🎯'],
          sentiment: 'Accomplished 🎯',
          category: 'Learning',
        },
        {
          id: 5,
          user: {
            name: 'Alex Johnson',
            avatar: 'https://i.pravatar.cc/100?img=7',
          },
          postedTime: '12 hours ago',
          audio: true,
          content:
            "Cooked my grandmother's recipe for the first time today. The kitchen filled with aromas that transported me back to childhood summers at her house. Food isn't just sustenance - it's memory, tradition, and love passed down through generations. Every ingredient told a story, every step connected me to my roots.",
          emojis: ['🍳', '❤️', '👵', '🏠', '😋'],
          sentiment: 'Nostalgic 💭',
          category: 'Family',
        },
      ];

      // App state
      let bookmarks = [1, 3, 5];
      let userStories = [];

      // DOM Elements
      const storyScreen = document.getElementById('story-screen');
      const bookmarkScreen = document.getElementById('bookmark-screen');
      const userScreen = document.getElementById('user-screen');
      const tabStory = document.getElementById('tab-story');
      const tabBookmark = document.getElementById('tab-bookmark');
      const tabUser = document.getElementById('tab-user');
      const fab = document.querySelector('.fab');
      const postStoryBtn = document.getElementById('post-story-btn');
      const newStoryText = document.getElementById('new-story-text');
      const userPostsDiv = document.getElementById('user-posts');
      const modalOverlay = document.getElementById('modal-overlay');
      const modalContent = document.getElementById('modal-content');
      const modalCloseBtn = modalOverlay.querySelector('.modal-close');

      // Utility functions
      function truncateText(text, maxLength = 150) {
        return text.length > maxLength
          ? text.slice(0, maxLength) + '...'
          : text;
      }

      function createEmptyState(icon, title, message) {
        return `
      <div class="empty-state">
        <i class="${icon}"></i>
        <h3>${title}</h3>
        <p>${message}</p>
      </div>
    `;
      }

      // Render functions
      function renderStoryCard(story) {
        const isBookmarked = bookmarks.includes(story.id);
        const truncatedContent = truncateText(story.content);
        const needsReadMore = story.content.length > 150;

        return `
      <div class="card" data-id="${story.id}">
        <div class="card-header">
          <div class="user-row">
            <div class="user-details">
              <img class="avatar" src="${story.user.avatar}" alt="${
          story.user.name
        }">
              <div class="user-info">
                <span class="user-name">${story.user.name}</span>
                <span class="posted-time">${story.postedTime}</span>
              </div>
            </div>
            <div class="header-actions">
              ${
                story.audio
                  ? '<div class="audio-icon" title="Play Audio"><i class="fas fa-volume-up"></i></div>'
                  : ''
              }
              <div class="bookmark-icon ${
                isBookmarked ? 'bookmarked' : ''
              }" title="Toggle Bookmark" data-id="${story.id}">
                <i class="fas fa-bookmark"></i>
              </div>
            </div>
          </div>
        </div>
        <div class="card-content">
          <span>${truncatedContent}</span>
          ${
            needsReadMore
              ? `<div class="show-more" data-id="${story.id}">Read more</div>`
              : ''
          }
        </div>
        <div class="card-footer">
          <div class="emoji-group">
            ${story.emojis
              .map(
                (emoji) => `<span title="React with ${emoji}">${emoji}</span>`
              )
              .join('')}
          </div>
          <div class="footer-right">
            <div class="sentiment">${story.sentiment}</div>
            <div class="category">${story.category}</div>
          </div>
        </div>
      </div>
    `;
      }

      function renderStories() {
        if (stories.length === 0) {
          storyScreen.innerHTML = createEmptyState(
            'fas fa-book-open',
            'No Stories Yet',
            'Be the first to share your story!'
          );
          return;
        }

        storyScreen.innerHTML = stories
          .map((story) => renderStoryCard(story))
          .join('');
        setupEventListeners();
      }

      function renderBookmarks() {
        const bookmarkedStories = stories.filter((story) =>
          bookmarks.includes(story.id)
        );

        if (bookmarkedStories.length === 0) {
          bookmarkScreen.innerHTML = createEmptyState(
            'fas fa-bookmark',
            'No Bookmarks',
            'Save stories you love to read them later'
          );
          return;
        }

        const bookmarkList = bookmarkedStories
          .map(
            (story) => `
      <li class="bookmark-item">
        <strong>${story.user.name}:</strong> ${truncateText(story.content, 100)}
        <div style="margin-top: 8px; opacity: 0.7; font-size: 12px;">${
          story.postedTime
        }</div>
      </li>
    `
          )
          .join('');

        bookmarkScreen.innerHTML = `<ul class="bookmark-list">${bookmarkList}</ul>`;
      }

      function renderUserStories() {
        if (userStories.length === 0) {
          userPostsDiv.innerHTML = createEmptyState(
            'fas fa-edit',
            'No Stories Yet',
            'Share your first story with the world!'
          );
          return;
        }

        const userCards = userStories.map((content, index) => {
          const story = {
            id: `user-${index}`,
            user: { name: 'You', avatar: 'https://i.pravatar.cc/100?img=65' },
            postedTime: 'Just now',
            audio: false,
            content: content,
            emojis: ['👍', '❤️', '😊'],
            sentiment: 'Personal 💭',
            category: 'My Story',
          };
          return renderStoryCard(story);
        });

        userPostsDiv.innerHTML = userCards.join('');
        setupReadMoreListeners();
      }

      // Event listeners
      function setupEventListeners() {
        setupBookmarkListeners();
        setupReadMoreListeners();
        setupEmojiListeners();
      }

      function setupBookmarkListeners() {
        document.querySelectorAll('.bookmark-icon').forEach((icon) => {
          icon.addEventListener('click', (e) => {
            e.stopPropagation();
            const storyId = parseInt(icon.dataset.id);

            if (bookmarks.includes(storyId)) {
              bookmarks = bookmarks.filter((id) => id !== storyId);
              icon.classList.remove('bookmarked');
            } else {
              bookmarks.push(storyId);
              icon.classList.add('bookmarked');
            }

            // Add animation
            icon.style.transform = 'scale(1.3)';
            setTimeout(() => {
              icon.style.transform = 'scale(1)';
            }, 200);

            // Update bookmark screen if active
            if (bookmarkScreen.classList.contains('active')) {
              renderBookmarks();
            }
          });
        });
      }

      function setupReadMoreListeners() {
        document.querySelectorAll('.show-more').forEach((element) => {
          element.addEventListener('click', (e) => {
            e.stopPropagation();
            const storyId = element.dataset.id;
            let content;

            if (storyId.startsWith('user-')) {
              const index = parseInt(storyId.split('-')[1]);
              content = userStories[index];
            } else {
              const story = stories.find((s) => s.id == storyId);
              content = story ? story.content : '';
            }

            if (content) {
              showModal(content);
            }
          });
        });
      }

      function setupEmojiListeners() {
        document.querySelectorAll('.emoji-group span').forEach((emoji) => {
          emoji.addEventListener('click', (e) => {
            e.stopPropagation();
            // Add bounce animation
            emoji.style.animation = 'none';
            setTimeout(() => {
              emoji.style.animation = 'bounce 0.5s ease';
            }, 10);
          });
        });
      }

      // Modal functions
      function showModal(content) {
        modalContent.textContent = content;
        modalOverlay.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      }

      function hideModal() {
        modalOverlay.style.display = 'none';
        document.body.style.overflow = 'auto';
      }

      modalCloseBtn.addEventListener('click', hideModal);
      modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) hideModal();
      });

      // Tab switching
      function switchTab(activeTab) {
        // Remove active class from all tabs and screens
        [tabStory, tabBookmark, tabUser].forEach((tab) =>
          tab.classList.remove('active')
        );
        [storyScreen, bookmarkScreen, userScreen].forEach((screen) =>
          screen.classList.remove('active')
        );

        // Add active class to selected tab and screen
        if (activeTab === 'story') {
          tabStory.classList.add('active');
          storyScreen.classList.add('active');
          renderStories();
        } else if (activeTab === 'bookmark') {
          tabBookmark.classList.add('active');
          bookmarkScreen.classList.add('active');
          renderBookmarks();
        } else if (activeTab === 'user') {
          tabUser.classList.add('active');
          userScreen.classList.add('active');
          renderUserStories();
        }
      }

      // Post new story
      function postNewStory() {
        const text = newStoryText.value.trim();

        if (text === '') {
          // Add shake animation to input
          newStoryText.style.animation = 'shake 0.5s ease-in-out';
          setTimeout(() => {
            newStoryText.style.animation = 'none';
          }, 500);

          // Show error message
          const errorMsg = document.createElement('div');
          errorMsg.textContent = 'Please write something before posting!';
          errorMsg.style.cssText = `
        color: #e53e3e;
        font-size: 14px;
        margin-top: 8px;
        animation: fadeIn 0.3s ease;
      `;

          newStoryText.parentNode.appendChild(errorMsg);
          setTimeout(() => errorMsg.remove(), 3000);
          return;
        }

        // Add story to beginning of user stories
        userStories.unshift(text);
        newStoryText.value = '';

        // Add success animation
        postStoryBtn.style.background =
          'linear-gradient(135deg, #48bb78, #38a169)';
        postStoryBtn.innerHTML = '<i class="fas fa-check"></i> Posted!';

        setTimeout(() => {
          postStoryBtn.style.background =
            'linear-gradient(135deg, #667eea, #764ba2)';
          postStoryBtn.innerHTML =
            '<i class="fas fa-paper-plane"></i> Share Story';
        }, 1500);

        renderUserStories();
      }

      // Event listeners
      tabStory.addEventListener('click', () => switchTab('story'));
      tabBookmark.addEventListener('click', () => switchTab('bookmark'));
      tabUser.addEventListener('click', () => switchTab('user'));

      fab.addEventListener('click', () => {
        switchTab('user');
        setTimeout(() => {
          newStoryText.focus();
          newStoryText.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
      });

      postStoryBtn.addEventListener('click', postNewStory);

      // Handle enter key in textarea (Ctrl+Enter to post)
      newStoryText.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'Enter') {
          postNewStory();
        }
      });

      // Add shake animation for validation
      const shakeKeyframes = `
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
      20%, 40%, 60%, 80% { transform: translateX(5px); }
    }
  `;

      const bounceKeyframes = `
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-5px); }
    }
  `;

      // Add animations to stylesheet
      const styleSheet = document.createElement('style');
      styleSheet.textContent = shakeKeyframes + bounceKeyframes;
      document.head.appendChild(styleSheet);

      // Audio functionality (mock implementation)
      document.addEventListener('click', (e) => {
        if (e.target.closest('.audio-icon')) {
          const audioIcon = e.target.closest('.audio-icon');
          const icon = audioIcon.querySelector('i');

          // Toggle play/pause icon
          if (icon.classList.contains('fa-volume-up')) {
            icon.classList.remove('fa-volume-up');
            icon.classList.add('fa-pause');
            audioIcon.style.color = '#f093fb';

            // Mock audio playing
            setTimeout(() => {
              icon.classList.remove('fa-pause');
              icon.classList.add('fa-volume-up');
              audioIcon.style.color = '#667eea';
            }, 3000);
          }
        }
      });

      // Smooth scrolling for better UX
      function smoothScrollToTop() {
        window.scrollTo({
          top: 0,
          behavior: 'smooth',
        });
      }

      // Add scroll to top when switching tabs
      const originalSwitchTab = switchTab;
      switchTab = function (activeTab) {
        originalSwitchTab(activeTab);
        smoothScrollToTop();
      };

      // Add loading states
      function showLoading(container) {
        container.innerHTML = `
      <div class="card loading" style="height: 200px; margin-bottom: 20px;"></div>
      <div class="card loading" style="height: 180px; margin-bottom: 20px;"></div>
      <div class="card loading" style="height: 220px; margin-bottom: 20px;"></div>
    `;
      }

      // Enhanced search functionality (future feature)
      function addSearchCapability() {
        const searchInput = document.createElement('input');
        searchInput.type = 'text';
        searchInput.placeholder = 'Search stories...';
        searchInput.style.cssText = `
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 20px;
      border: 2px solid rgba(102, 126, 234, 0.2);
      border-radius: 12px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
    `;

        // Add search functionality here if needed
        // storyScreen.insertBefore(searchInput, storyScreen.firstChild);
      }

      // Initialize app
      function initializeApp() {
        renderStories();

        // Add some entrance animations
        const cards = document.querySelectorAll('.card');
        cards.forEach((card, index) => {
          card.style.opacity = '0';
          card.style.transform = 'translateY(20px)';

          setTimeout(() => {
            card.style.transition = 'all 0.5s ease';
            card.style.opacity = '1';
            card.style.transform = 'translateY(0)';
          }, index * 100);
        });
      }

      // Handle keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.altKey) {
          switch (e.key) {
            case '1':
              e.preventDefault();
              switchTab('story');
              break;
            case '2':
              e.preventDefault();
              switchTab('bookmark');
              break;
            case '3':
              e.preventDefault();
              switchTab('user');
              break;
            case 'n':
              e.preventDefault();
              fab.click();
              break;
          }
        }
      });

      // Add keyboard shortcuts info
      const keyboardShortcuts = `
    <div style="position: fixed; bottom: 100px; left: 20px; 
                background: rgba(0,0,0,0.8); color: white; 
                padding: 10px; border-radius: 8px; font-size: 12px;
                opacity: 0; transition: opacity 0.3s ease;
                pointer-events: none; z-index: 1001;" id="shortcuts-tooltip">
      <div>Alt+1: Stories</div>
      <div>Alt+2: Bookmarks</div>
      <div>Alt+3: Profile</div>
      <div>Alt+N: New Story</div>
    </div>
  `;

      document.body.insertAdjacentHTML('beforeend', keyboardShortcuts);

      // Show shortcuts on long press of any key
      let keyPressTimer;
      document.addEventListener('keydown', (e) => {
        if (e.altKey) {
          clearTimeout(keyPressTimer);
          keyPressTimer = setTimeout(() => {
            document.getElementById('shortcuts-tooltip').style.opacity = '1';
          }, 1000);
        }
      });

      document.addEventListener('keyup', () => {
        clearTimeout(keyPressTimer);
        document.getElementById('shortcuts-tooltip').style.opacity = '0';
      });

      // Initialize the app
      initializeApp();
    </script>
  </body>
</html>
